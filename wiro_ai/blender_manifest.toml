schema_version = "1.0.0"

id = "wiro_ai"
version = "1.1.0"
name = "Wiro AI 3D Generator"
tagline = "Text and image to 3D, textures and 1,000+ models from Wiro AI"
maintainer = "Wiro AI <support@wiro.ai>"
type = "add-on"

website = "https://github.com/wiroai/Wiro-Blender"

tags = ["3D View", "Add Mesh", "Import-Export", "Material"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Wiro AI"]

[permissions]
network = "Send prompts and files to Wiro AI and download the results"
files = "Read input files and save the generated results"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".*"]
