schema_version = "1.0.0"

id = "wiro_ai"
version = "1.0.0"
name = "Wiro AI 3D Generator"
tagline = "Generate 3D models from text or images with Wiro AI"
maintainer = "Wiro AI <support@wiro.ai>"
type = "add-on"

website = "https://github.com/wiroai/Wiro-Blender"

tags = ["3D View", "Add Mesh", "Import-Export"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Wiro AI"]

[permissions]
network = "Send prompts and images to Wiro AI and download the models"
files = "Read input images and save the generated GLB files"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".*"]
