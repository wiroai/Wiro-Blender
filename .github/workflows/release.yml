name: Release

# Builds the extension package with Blender, attaches it to the GitHub release
# of the tag (for example v1.1.0), and publishes the Wiro AI extension
# repository on GitHub Pages, so Blender can install and update the add-on
# from https://wiroai.github.io/Wiro-Blender/index.json.
#
# A tag push runs it. "Run workflow" runs it again for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and publish, for example v1.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      VERSION: "5.3.0"
      SHA256: dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag against the manifest
        run: |
          manifest_version="$(python3 -c 'import tomllib; print(tomllib.load(open("wiro_ai/blender_manifest.toml", "rb"))["version"])')"
          test "v${manifest_version}" = "${TAG}"

      - name: Download Blender
        run: |
          file="blender-${VERSION}-linux-x64.tar.xz"
          for mirror in \
            https://mirrors.ocf.berkeley.edu/blender/release \
            https://ftp.nluug.nl/pub/graphics/blender/release \
            https://mirror.clarkson.edu/blender/release; do
            if curl -fsSL --retry 3 -o "$file" "$mirror/Blender${VERSION%.*}/${file}"; then
              break
            fi
          done
          echo "${SHA256}  ${file}" | sha256sum -c -
          mkdir blender
          tar -xf "$file" -C blender --strip-components=1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Validate and build
        run: |
          blender/blender --command extension validate wiro_ai
          mkdir -p dist
          blender/blender --command extension build --source-dir wiro_ai --output-dir dist

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" dist/wiro_ai-*.zip --clobber
          else
            gh release create "${TAG}" dist/wiro_ai-*.zip --title "${TAG}" --generate-notes
          fi

      - name: Build the extension repository
        run: |
          mkdir -p site
          cp dist/wiro_ai-*.zip site/
          blender/blender --command extension server-generate --repo-dir site --html
          python3 -c 'import json; data = json.load(open("site/index.json")); print([(p["id"], p["version"], p["archive_url"]) for p in data["data"]])'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
